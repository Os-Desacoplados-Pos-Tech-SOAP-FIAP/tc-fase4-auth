name: Pipeline

# Esteira da Lambda de autenticação em dois jobs:
#   ci     -> lint, testes com cobertura, build, terraform fmt/validate e SonarCloud (PR e push na main)
#   deploy -> plan | apply | destroy só pelo botão (workflow_dispatch), com aprovação no environment `aws-infra`
# Merge na main NÃO faz deploy: o apply depende do state da infra e do ALB dos serviços (ordem do spec §6.6).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação do Terraform'
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::538880133939:role/gha-tc-fase4-auth

jobs:
  ci:
    name: ci
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o Sonar usa o histórico para identificar o código novo

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Testes com cobertura ≥ 80%
        run: npm run test:cov

      - name: Build dos bundles
        run: npm run build

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check

      - name: Terraform init (sem backend)
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  deploy:
    name: deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Gate de custo: aguarda aprovação de um revisor do environment.
    environment: aws-infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Build dos bundles
        # O destroy também precisa dos diretórios de bundle: o archive_file do
        # Terraform lê `dist/` mesmo quando a operação é de remoção.
        run: npm run build

      - name: Credenciais AWS via OIDC (sem secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=terraform init -input=false

      - name: Terraform plan
        if: inputs.action == 'plan'
        run: |
          terraform -chdir=terraform plan -no-color -input=false | tee plan.txt
          {
            echo '## Terraform plan'
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform -chdir=terraform apply -auto-approve -input=false

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform -chdir=terraform destroy -auto-approve -input=false
